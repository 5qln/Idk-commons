[project]
name = "trail-commons"
description = "Agent-side publisher that moves /idk questions into a public commons."
requires-python = ">=3.9"
license = { text = "see LICENSE" }
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
