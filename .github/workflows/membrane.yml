name: membrane

# The commons-side membrane gate — the third of three. Runs on every push and
# pull request so no question carrying private content (α, Z, ∇, B'', the Codex
# seal, a cycle number) can land in the seed commons, including via a direct push
# or a fork's PR. It trusts no client. The lint lives with the tool at
# skills/trail-commons/membrane_lint.py and reads the shared membrane-spec.json.

on:
  push:
    paths: ["questions/**", "skills/trail-commons/**", "membrane-spec.json", ".github/workflows/membrane.yml"]
  pull_request:
    paths: ["questions/**", "skills/trail-commons/**", "membrane-spec.json", ".github/workflows/membrane.yml"]

permissions:
  contents: read

jobs:
  membrane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run the membrane gate over every question
        run: python3 skills/trail-commons/membrane_lint.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile skills/trail-commons/*.py
      - name: Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
